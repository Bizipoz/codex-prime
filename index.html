<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bienvenue sur Codex Prime, le point de départ de votre prochain projet.">
  <title>Codex Prime — Bienvenue</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0c1220; color: #eef2ff; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: 100%; max-width: 720px; padding: clamp(28px, 6vw, 64px); border: 1px solid #334155; border-radius: 24px; background: #151e30; }
    .badge { margin: 0 0 24px; color: #a5b4fc; font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 20px; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.1; letter-spacing: -.04em; }
    p { color: #cbd5e1; font-size: 1.1rem; line-height: 1.7; }
    .note { margin-top: 36px; padding-top: 24px; border-top: 1px solid #334155; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="welcome-title">
      <p class="badge">Codex Prime</p>
      <h1 id="welcome-title">Votre prochain projet commence ici.</h1>
      <p>Bienvenue sur votre nouvelle page d’accueil. Un espace simple pour présenter vos idées et donner vie à vos projets.</p>
      <p class="note">Cette page est prête à être personnalisée.</p>
    </section>
  </main>
</body>
</html>
